<!DOCTYPE html>
<html>
<head>
    <title>IoT Weather Station</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            text-align: center;
            transition: background 0.6s ease, color 0.6s ease;
        }

        h1 { margin-top: 20px; }

        /* TOP SECTION */
        .top-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 20px;
        }

        /* BOTTOM SECTION */
        .bottom-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 20px;
        }

        .card {
            padding: 25px;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0,255,255,0.4);
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .icon {
            font-size: 50px;
        }

        .value {
            font-size: 24px;
            margin-top: 10px;
        }

        canvas {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 10px;
        }

        /* 🌧 CSS Rain Effect */
        .rain {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            top: 0;
            left: 0;
            display: none;
            overflow: hidden;
        }

        .rain span {
            position: absolute;
            width: 2px;
            height: 20px;
            background: rgba(255,255,255,0.6);
            animation: rainFall 0.5s linear infinite;
        }

        @keyframes rainFall {
            from { transform: translateY(-100px); }
            to { transform: translateY(100vh); }
        }

        @media(max-width: 900px){
            .top-container { grid-template-columns: repeat(2, 1fr); }
            .bottom-container { grid-template-columns: 1fr; }
        }

    </style>
</head>

<body>

<div class="rain" id="rainEffect"></div>

<h1>📘 ESD Assignment Project</h1>
<h2>🌦 IoT Based Weather Station</h2>

<!-- TOP 4 CARDS -->
<div class="top-container">

    <div class="card">
        <div class="icon">🌡</div>
        <div class="value" id="temp">-- °C</div>
    </div>

    <div class="card">
        <div class="icon">💧</div>
        <div class="value" id="hum">-- %</div>
    </div>

    <div class="card">
        <div class="icon" id="lightIcon">☀</div>
        <div class="value" id="light">--</div>
    </div>

    <div class="card">
        <div class="icon" id="rainIcon">☁</div>
        <div class="value" id="rain">--</div>
    </div>

</div>

<!-- BOTTOM 2 GRAPHS -->
<div class="bottom-container">

    <div class="card">
        <h3>Temperature Graph</h3>
        <canvas id="tempChart"></canvas>
    </div>

    <div class="card">
        <h3>Humidity Graph</h3>
        <canvas id="humChart"></canvas>
    </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCT0qBbj253QOoD6qfKA18g_annPTr6XUE",
  authDomain: "iot-weather-station-8a6c3.firebaseapp.com",
  databaseURL: "https://iot-weather-station-8a6c3-default-rtdb.firebaseio.com",
  projectId: "iot-weather-station-8a6c3",
  storageBucket: "iot-weather-station-8a6c3.firebasestorage.app",
  messagingSenderId: "221470258587",
  appId: "1:221470258587:web:59305d07f37e6360c65d3e"
};

const app = initializeApp(firebaseConfig);
const database = getDatabase(app);
const weatherRef = ref(database, 'weather');

const tempCtx = document.getElementById('tempChart').getContext('2d');
const humCtx = document.getElementById('humChart').getContext('2d');

const tempChart = new Chart(tempCtx, {
    type: 'line',
    data: { labels: [], datasets: [{
        label: 'Temperature (°C)',
        borderColor: 'red',
        data: [],
        tension: 0.3
    }]},
    options: { scales: { x:{ticks:{color:'white'}}, y:{ticks:{color:'white'}} } }
});

const humChart = new Chart(humCtx, {
    type: 'line',
    data: { labels: [], datasets: [{
        label: 'Humidity (%)',
        borderColor: 'cyan',
        data: [],
        tension: 0.3
    }]},
    options: { scales: { x:{ticks:{color:'white'}}, y:{ticks:{color:'white'}} } }
});

onValue(weatherRef, (snapshot) => {
    const data = snapshot.val();
    if (data) {

        document.getElementById("temp").innerText = data.temperature + " °C";
        document.getElementById("hum").innerText = data.humidity + " %";
        document.getElementById("light").innerText = data.light;
        document.getElementById("rain").innerText = data.rain;

        document.getElementById("lightIcon").innerText =
            data.light === "BRIGHT" ? "☀" : "🌙";

        document.getElementById("rainIcon").innerText =
            data.rain === "RAIN" ? "🌧" : "☁";

        /* 🌧 Rain Animation */
        const rainContainer = document.getElementById("rainEffect");

        if (data.rain === "RAIN") {
            rainContainer.style.display = "block";

            if (rainContainer.childElementCount === 0) {
                for (let i = 0; i < 120; i++) {
                    const drop = document.createElement("span");
                    drop.style.left = Math.random() * window.innerWidth + "px";
                    drop.style.animationDuration = (0.3 + Math.random()) + "s";
                    rainContainer.appendChild(drop);
                }
            }
        } else {
            rainContainer.style.display = "none";
            rainContainer.innerHTML = "";
        }

        /* ☀ Bright / Dark Theme */
        if (data.light === "BRIGHT") {
            document.body.style.background =
                "linear-gradient(135deg, #ffefba, #ffffff)";
            document.body.style.color = "black";
        } else {
            document.body.style.background =
                "linear-gradient(135deg, #141e30, #243b55)";
            document.body.style.color = "white";
        }

        const time = new Date().toLocaleTimeString();

        if (tempChart.data.labels.length > 15) {
            tempChart.data.labels.shift();
            tempChart.data.datasets[0].data.shift();
            humChart.data.labels.shift();
            humChart.data.datasets[0].data.shift();
        }

        tempChart.data.labels.push(time);
        tempChart.data.datasets[0].data.push(data.temperature);
        tempChart.update();

        humChart.data.labels.push(time);
        humChart.data.datasets[0].data.push(data.humidity);
        humChart.update();
    }
});
</script>

</body>
</html>
